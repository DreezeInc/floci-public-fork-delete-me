apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-cloud-provider
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-controller
  namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tagging-controller
  namespace: kube-system
---
apiVersion: v1
kind: Service
